        <script src="auth.js"></script>
        <script src="app.js"></script>
        <script>
function logout() {
    localStorage.removeItem("token");
    window.location.href = "index";

}
const deleteBtn = document.getElementById("deleteAccount");

deleteBtn.addEventListener("click", function () {

    const confirmar = confirm("¿Seguro que quieres borrar tu cuenta?");

    if (!confirmar) {
        return;
    }

    const token = localStorage.getItem("token");

    if (!token) {
        alert("No hay sesión activa");
        return;
    }


    fetch("https://www.creantunegocio.com/borrar_cuenta", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            token: token
        })

    })

    .then(res => res.json())

    .then(data => {

        if (data.success) {

            alert("Tu cuenta fue eliminada");

            // borrar datos guardados del navegador
            localStorage.removeItem("token");
            localStorage.removeItem("user_id");

            // enviar al login
            window.location.href = "index";

        } else {

            alert(data.error);

        }

    })

    .catch(error => {

        console.log(error);
        alert("Error del servidor");

    });

});

const edita = document.createElement('button');
edita.textContent = "Editar";
edita.className = "btn-editar";

const del = document.createElement('button');
del.textContent = "Eliminar";
del.className = "btn-eliminar";
</script>
