
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disfruta la película</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;font-family:Arial,sans-serif}
h1{text-align:center;margin:30px 10px}
.video-contenedor{display:none;max-width:850px;margin:30px auto;padding:20px;background:#151515;border-radius:15px;color:white;text-align:center}
.video-contenedor video{width:100%;border-radius:12px;background:#000}
#progresoVideo{color:#ccc;font-size:14px}
#reiniciarVideo{background:#2563eb;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:15px}
#reiniciarVideo:hover{background:#1d4ed8}
#estado{display:none;text-align:center;margin:40px 15px;color:#333}
@media(max-width:600px){.video-contenedor{margin:15px;padding:12px}}

.video-header{
    width:100%;
    padding:18px 25px;
    background:#151515;
    display:flex;
    align-items:center;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}
.btn-volver{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:white;
    background:#2563eb;
    padding:11px 20px;
    border-radius:10px;
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    transition:all .3s ease;
}
.btn-volver:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
    box-shadow:0 5px 12px rgba(37,99,235,.3);
}
.btn-volver span{
    font-size:21px;
    line-height:1;
}
@media(max-width:600px){
    .video-header{padding:13px 15px}
    .btn-volver{padding:10px 16px;font-size:14px}
}
</style>
</head>
<body>
 <header class="video-header">
    <a href="/tareas" class="btn-volver">
        <span>←</span> Mis tareas
    </a>
</header>
<h1>Disfruta la película</h1>
<p id="estado"></p>

<div class="video-contenedor" id="contenedorVideo">
<h2>Disfruta nuestro video</h2>
<video id="miVideo" controls playsinline preload="metadata">
<source src="https://firebasestorage.googleapis.com/v0/b/jardines-4e1db.firebasestorage.app/o/2026-07-17%2017-45-25.mp4?alt=media&amp;token=121fa263-7f93-4d78-9741-fcba3720e2ed" type="video/mp4">
Tu navegador no soporta videos.
</video>
<p id="progresoVideo">Tu progreso se guarda automáticamente.</p>
<button id="reiniciarVideo" type="button">Ver desde el principio</button>
</div>

<script>
const token=localStorage.getItem("token");
const username=localStorage.getItem("username");
const estado=document.getElementById("estado");

if(!token||!username){
    window.location.replace("login.html");
}else{
    verificarSesion();
}

async function verificarSesion(){
    try{
        const respuesta=await fetch("https://www.creantunegocio.com/api/verificar-token",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({token:token})
        });

        if(!respuesta.ok){
            localStorage.removeItem("token");
            localStorage.removeItem("username");
            window.location.replace("login.html");
            return;
        }

        const datos=await respuesta.json();

        if(datos.ok===true){
            iniciarVideo();
        }else{
            localStorage.removeItem("token");
            localStorage.removeItem("username");
            window.location.replace("login.html");
        }
    }catch(error){
        console.error("Error verificando sesión:",error);
        estado.style.display="block";
        estado.textContent="No se pudo verificar tu sesión. Comprueba tu conexión o inténtalo nuevamente.";
    }
}

function iniciarVideo(){
    const video=document.getElementById("miVideo");
    const progreso=document.getElementById("progresoVideo");
    const boton=document.getElementById("reiniciarVideo");
    const contenedor=document.getElementById("contenedorVideo");
    const clave="progreso_mi_video_"+username;
    let listo=false;

    contenedor.style.display="block";

    video.addEventListener("loadedmetadata",function(){
        const tiempo=Number(localStorage.getItem(clave));

        if(Number.isFinite(tiempo)&&tiempo>0&&tiempo<video.duration-2){
            video.currentTime=tiempo;
            progreso.textContent="Puedes continuar donde dejaste el video.";
        }else{
            localStorage.removeItem(clave);
        }

        listo=true;
    });

    function guardarProgreso(){
        if(listo&&!video.ended&&Number.isFinite(video.currentTime)){
            localStorage.setItem(clave,String(video.currentTime));
        }
    }

    video.addEventListener("timeupdate",guardarProgreso);
    video.addEventListener("pause",guardarProgreso);
    window.addEventListener("pagehide",guardarProgreso);
    document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="hidden")guardarProgreso();
    });

    video.addEventListener("ended",function(){
        localStorage.removeItem(clave);
        progreso.textContent="¡Has terminado de ver la película!";
    });

    boton.addEventListener("click",function(){
        video.currentTime=0;
        localStorage.removeItem(clave);
        progreso.textContent="Video reiniciado.";
    });

    video.addEventListener("error",function(){
        progreso.textContent="No se pudo cargar el video. Comprueba el enlace de Firebase.";
    });
}
</script>
</body>
</html>
