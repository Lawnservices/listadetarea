<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pelicla</title>
    <style>
        
.video-contenedor {
    max-width: 850px;
    margin: 30px auto;
    padding: 20px;
    background: #151515;
    border-radius: 15px;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
}

.video-contenedor video {
    width: 100%;
    border-radius: 12px;
    background: black;
}

#progresoVideo {
    color: #ccc;
    font-size: 14px;
}

#reiniciarVideo {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

    </style>
</head>
<body>
    <h1>disfuta la pelicula</h1>

<div class="video-contenedor">
    <h2>Disfruta nuestro video</h2>

    <video id="miVideo" controls playsinline preload="metadata">
        <source src="https://firebasestorage.googleapis.com/v0/b/jardines-4e1db.firebasestorage.app/o/2026-07-17%2017-45-25.mp4?alt=media&amp;token=121fa263-7f93-4d78-9741-fcba3720e2ed" type="video/mp4">
        Tu navegador no soporta videos.
    </video>

    <p id="progresoVideo">Tu progreso se guarda automáticamente.</p>

    <button id="reiniciarVideo">Ver desde el principio</button>
</div>
<script>

const video = document.getElementById("miVideo");
const progreso = document.getElementById("progresoVideo");
const boton = document.getElementById("reiniciarVideo");

const clave = "progreso_mi_video";

let guardado = false;

// Recuperar el último segundo visto
video.addEventListener("loadedmetadata", function() {

    const tiempo = localStorage.getItem(clave);

    if (tiempo && Number(tiempo) < video.duration - 2) {
        video.currentTime = Number(tiempo);
        progreso.textContent =
            "Puedes continuar donde dejaste el video.";
    }

    guardado = true;
});

// Guardar cada 5 segundos
video.addEventListener("timeupdate", function() {

    if (guardado && !video.paused) {
        localStorage.setItem(clave, video.currentTime);
    }

});

// Guardar al pausar
video.addEventListener("pause", guardarProgreso);

// Guardar cuando sale de la página
window.addEventListener("pagehide", guardarProgreso);

function guardarProgreso() {

    if (guardado && !video.ended) {
        localStorage.setItem(clave, video.currentTime);
    }
}

// Si termina, comenzar desde cero la próxima vez
video.addEventListener("ended", function() {
    localStorage.removeItem(clave);
    progreso.textContent = "¡Has terminado de ver el video!";
});

// Reiniciar video
boton.addEventListener("click", function() {

    video.currentTime = 0;
    localStorage.removeItem(clave);

    progreso.textContent = "Video reiniciado.";
});

</script>
 
</body>
</html>
